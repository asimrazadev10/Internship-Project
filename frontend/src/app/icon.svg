<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The Convo app icon. Geometry mirrors brand-mark.tsx (MARK_ARC / MARK_DOTS) scaled x(32/24)
    with the chip full-bleed, since browsers round favicon corners themselves.

    Hex is hard-coded on purpose: a favicon is fetched as an external resource, so the app's CSS
    custom properties never reach it. Keep these in step with --primary / --aurora-cyan.
  -->
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#chip)"/>
  <path d="M 3.3 22 C 9.3 14, 18 24, 28.7 12.7" stroke="#fff" stroke-width="2.2"
        stroke-linecap="round" fill="none" opacity="0.4"/>
  <circle cx="12" cy="13.3" r="6" fill="#fff" opacity="0.55"/>
  <circle cx="20" cy="18.7" r="6" fill="#fff"/>
</svg>
