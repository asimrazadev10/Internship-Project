# Local development services for the Group Chat Application.
#
# MongoDB   — system of record for users, groups, memberships and messages.
# Redis     — Socket.IO adapter (multi-node broadcast fan-out) and BullMQ job store.
#
# Run from the repo root: `docker compose up -d`.
#
# The MongoDB port 27017 is standard; the backend's config lives in backend/.env
# and its MONGODB_URI must use the same 27017.

services:
  mongodb:
    image: mongo:7
    container_name: chat-mongodb
    restart: unless-stopped
    # Single-node REPLICA SET, not standalone. GroupsService wraps group + membership creation in
    # a MongoSessionService.withTransaction, and transactions are only supported on a replica set
    # member — on a standalone this fails with "Transaction numbers are only allowed on a replica
    # set member or mongos". rs0 = the set name; there is one member, this container.
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DB:-chatdb}
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      # Ready = a member can be reached AND the set is initiated (rs.initiate runs once; it
      # throws until the set is configured, after which rs.status() succeeds). This also makes
      # docker compose wait for the primary election before reporting healthy.
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval 'try { rs.status() } catch (e) { rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"localhost:27017\" }] }) }' > /dev/null && mongosh --quiet --eval 'quit(rs.status().ok ? 0 : 1)'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: chat-redis
    restart: unless-stopped
    # appendonly yes => AOF persistence. BullMQ keeps queued jobs in Redis, so without
    # persistence a container restart silently drops every pending summary job.
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb-data:
  redis-data: